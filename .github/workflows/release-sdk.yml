name: Release SDK

on:
  release:
    types: [created]

jobs:
  publish:
    # Only release the SDK when the release tag is prefixed `sdk-v*`, so
    # unrelated tag schemes (e.g. app deploys) don't accidentally publish.
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/browse-sdk
        run: bun run typecheck

      - name: Build
        working-directory: packages/browse-sdk
        run: bun run build

      # Pre-releases (e.g. 0.1.0-rc.0) publish under the `rc` dist-tag so
      # consumers who run `npm install @parity/browse-sdk` (which resolves
      # `@latest`) never pick one up by accident. Stable versions publish
      # to `@latest`.
      - name: Determine npm dist-tag
        id: tag
        working-directory: packages/browse-sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=" >> "$GITHUB_OUTPUT"
          fi

      # PCF publishes its build of the SDK under @polkadot-community-foundation. Keep the
      # @parity/browse-sdk name in-tree (the app references it everywhere) and rescope-at-pack:
      # the script stages a @polkadot-community-foundation/browse-sdk tarball into pack-output/.
      - name: Stage @polkadot-community-foundation/browse-sdk tarball (rescope-at-pack)
        working-directory: packages/browse-sdk
        run: node scripts/rescope-pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/browse-sdk/pack-output/*.tgz

      # Publish via PCF's own npm-publish-automation (holds the @polkadot-community-foundation
      # npm token), NOT paritytech's. Dispatch is inlined (public create-github-app-token + a
      # gh api call) rather than the automation's composite action, because sharing a PRIVATE
      # repo's actions cross-repo is plan-gated. npm_tag carries the rc/latest dist-tag.
      - name: Mint App token (dispatch scope)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: Polkadot-Community-Foundation
          repositories: npm-publish-automation

      - name: Dispatch PCF npm-publish-automation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TAG: ${{ steps.tag.outputs.npm_tag }}
        run: |
          set -euo pipefail
          printf '{"ref":"main","inputs":{"repo":"%s","run_id":"%s","artifact_name":"packages","npm_tag":"%s"}}' \
            "${{ github.repository }}" "${{ github.run_id }}" "$NPM_TAG" \
          | gh api -X POST \
              /repos/Polkadot-Community-Foundation/npm-publish-automation/actions/workflows/publish.yml/dispatches \
              --input -
