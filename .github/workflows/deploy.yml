name: Deploy

on:
  push:
    branches: [main]
    paths: ['app/**']
  pull_request:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      source-hash: ${{ steps.source-hash.outputs.hash }}
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute source hash
        id: source-hash
        run: echo "hash=$(git ls-files app/src/ app/package.json app/vite.config.ts app/tsconfig.json app/index.html app/widget.html app/polkadot-app-deploy.config.ts bun.lock | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deployment cache
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .deployment-marker
          key: deploy-browse-${{ steps.source-hash.outputs.hash }}
          lookup-only: true

  build:
    name: Build
    needs: check
    if: needs.check.outputs.cache-hit != 'true' || inputs.skip-cache
    uses: ./.github/workflows/build.yml

  deploy:
    name: Deploy ${{ matrix.target.display-name }}
    needs: [check, build]
    if: needs.check.outputs.cache-hit != 'true' || inputs.skip-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - env: devnet
            display-name: Products Devnet (public Paseo AH 1000)
            genesis: '0xd6eec26135305a8ad257a20d003357284c8aa03d0bdb2b357ab0a22371e11ef2'
            reuse-artifact: false
            required: true
    outputs:
      cid: ${{ steps.final.outputs.cid }}
      domain: ${{ steps.final.outputs.domain }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute domain
        id: domain
        env:
          DOMAIN: ${{ secrets.APP_DOTNS_DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::error::Required secret APP_DOTNS_DOMAIN is not set"
            exit 1
          fi
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "value=${DOMAIN}.dot" >> "$GITHUB_OUTPUT"
          else
            REF="${{ github.event.pull_request.head.ref || github.ref_name }}"
            SANITIZED=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-48)
            echo "value=${DOMAIN}-${SANITIZED}00.dot" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: matrix.target.reuse-artifact == true
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      - uses: oven-sh/setup-bun@v2
        if: matrix.target.reuse-artifact != true
        with:
          bun-version: latest

      # Restore the network snapshot published by the daily snapshot job so a
      # fresh build bakes it in, matching what build.yml does for the shared
      # artifact. Absent until the first snapshot run for this network.
      - name: Restore snapshot CID
        if: matrix.target.reuse-artifact != true && matrix.target.snapshot-cache-prefix != ''
        uses: actions/cache/restore@v4
        with:
          path: .snapshot-cid
          key: ${{ matrix.target.snapshot-cache-prefix }}
          restore-keys: |
            ${{ matrix.target.snapshot-cache-prefix }}-

      - name: Read snapshot CID
        id: snapshot-cid
        if: matrix.target.reuse-artifact != true
        run: |
          if [ -f .snapshot-cid/cid ]; then
            echo "cid=$(cat .snapshot-cid/cid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore username snapshot CID
        if: matrix.target.reuse-artifact != true && matrix.target.username-snapshot-cache-prefix != ''
        uses: actions/cache/restore@v4
        with:
          path: .usernames-snapshot-cid
          key: ${{ matrix.target.username-snapshot-cache-prefix }}
          restore-keys: |
            ${{ matrix.target.username-snapshot-cache-prefix }}-

      - name: Read username snapshot CID
        id: usernames-cid
        if: matrix.target.reuse-artifact != true
        run: |
          if [ -f .usernames-snapshot-cid/cid ]; then
            echo "cid=$(cat .usernames-snapshot-cid/cid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for ${{ matrix.target.env }}
        if: matrix.target.reuse-artifact != true
        working-directory: app
        env:
          NETWORK_GENESIS_HASH: ${{ matrix.target.genesis }}
          APP_DOMAINS_SNAPSHOT_CID: ${{ steps.snapshot-cid.outputs.cid }}
          APP_USERNAMES_SNAPSHOT_CID: ${{ steps.usernames-cid.outputs.cid }}
        run: |
          bun install --frozen-lockfile
          bun run build

      # Paseo-free guard. A blanket `grep paseo` is NOT usable here: the app's
      # KNOWN_NETWORKS map and the bundled PAPI chain descriptors embed Paseo
      # RPC/genesis strings on EVERY build (including a correct Summit build),
      # so it would fail legitimate Summit deploys. Instead we assert the bundle
      # was baked with the Summit genesis (matrix.target.genesis) — i.e. that the
      # build did NOT silently fall back to the Paseo default genesis.
      - name: Assert bundle targets devnet (not the Paseo default)
        if: matrix.target.reuse-artifact != true
        env:
          EXPECTED_GENESIS: ${{ matrix.target.genesis }}
        run: |
          if ! grep -rIql "$EXPECTED_GENESIS" app/dist/spa; then
            echo "::error::Built bundle does not contain the devnet genesis ($EXPECTED_GENESIS) — build may have fallen back to the Paseo default"
            exit 1
          fi
          echo "OK: bundle baked with devnet genesis $EXPECTED_GENESIS"

      - name: Compute build hash
        id: hash
        # The product config is part of the hash: it decides what gets PUBLISHED
        # (manifest + executable subnames) without changing the built output.
        run: echo "hash=$({ find app/dist -type f -exec sha256sum {} \; ; sha256sum app/polkadot-app-deploy.config.ts; } | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deploy cache
        id: cache
        if: inputs.skip-cache != true
        uses: actions/cache@v4
        with:
          path: .deploy-cache
          key: deploy-${{ matrix.target.env }}-${{ steps.hash.outputs.hash }}

      - name: Load cached CID
        id: cached-deploy
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cid=$(cat .deploy-cache/cid)" >> "$GITHUB_OUTPUT"
          echo "::notice::Found cached CID: $(cat .deploy-cache/cid)"

      - name: Verify required secrets
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: |
          if [ -z "$MNEMONIC" ]; then
            echo "::error::Required secret MNEMONIC is not set"
            exit 1
          fi

      - name: Setup IPFS Kubo
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          KUBO_VERSION: v0.33.0
        run: |
          archive="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" "${base}/${archive}"
          curl -fsSL --retry 5 --retry-all-errors -o "${archive}.sha512" "${base}/${archive}.sha512"
          sha512sum -c "${archive}.sha512"
          tar -xzf "$archive"
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs --version

      - name: Initialize IPFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: ipfs init

      - name: Install polkadot-app-deploy (PCF fork)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # PCF fork of bulletin-deploy (renamed). ≥0.11.1 wires the Summit
          # Publisher; ships under the @polkadot-community-foundation scope.
          npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.12.1
          # Scoped symlink so require.resolve('@polkadot-community-foundation/
          # polkadot-app-deploy') resolves from app/ (the 0.11.x root export is
          # ESM-only and false-fails a bare require.resolve otherwise).
          mkdir -p app/node_modules/@polkadot-community-foundation
          ln -sfn "$(npm root -g)/@polkadot-community-foundation/polkadot-app-deploy" \
            app/node_modules/@polkadot-community-foundation/polkadot-app-deploy

      # On PR previews the deploy targets an ephemeral domain (browse-<branch>00.dot)
      # whose `widget.<domain>` subname is never registered, so the product-manifest
      # leg (which publishes the widget executable via setResolver on that subname)
      # ALWAYS reverts (0x1648fd01) and red-walls every PR — even though the SPA
      # itself deploys and verifies on-chain fine. The manifest/widget publish is
      # not needed to preview the SPA. Moving the auto-discovered config aside makes
      # the CLI skip the manifest leg (documented: a differently-named file is
      # silently ignored), so a preview deploy is SPA-only and goes green iff the
      # build uploads + sets contenthash — i.e. green ⟺ the deploy is healthy.
      # main keeps the config → full manifest + widget publish (widget.browse.dot
      # is registered, so it succeeds there).
      - name: Skip product manifest on preview (SPA-only deploy)
        if: github.ref != 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -f app/polkadot-app-deploy.config.ts ]; then
            mv app/polkadot-app-deploy.config.ts app/polkadot-app-deploy.config.ts.preview-disabled
            echo "::notice::Preview deploy — SPA-only (product manifest/widget publish skipped; ephemeral preview subnames are not registered)."
          fi

      - name: Deploy
        id: deploy
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: ${{ matrix.target.required != true }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            export MNEMONIC='${{ secrets.MNEMONIC }}'
            # Derive the Bulletin storage pool from the DEPLOYER mnemonic, not the
            # public dev phrase. deploy.ts reads BULLETIN_POOL_MNEMONIC for the pool
            # (falling back to DEV_PHRASE when unset) — those public accounts are not
            # authorized on the Bulletin chains, so uploads fail. The deployer's pool
            # (//deploy/N) is already authorized.
            export BULLETIN_POOL_MNEMONIC="$MNEMONIC"
            export NODE_OPTIONS='--max-old-space-size=8192'
            export APP_DOTNS_DOMAIN='${{ steps.domain.outputs.value }}'
            cd app
            polkadot-app-deploy dist/spa '${{ steps.domain.outputs.value }}' --env '${{ matrix.target.env }}'

      - name: Save deployment to cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.deploy.outcome == 'success'
        run: |
          mkdir -p .deploy-cache
          echo "${{ steps.deploy.outputs.cid }}" > .deploy-cache/cid

      - name: Set outputs
        id: final
        run: |
          DOMAIN="${{ steps.domain.outputs.value }}"
          DOMAIN="${DOMAIN%.dot}"
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "cid=${{ steps.cached-deploy.outputs.cid }}" >> "$GITHUB_OUTPUT"
          else
            echo "cid=${{ steps.deploy.outputs.cid }}" >> "$GITHUB_OUTPUT"
          fi
          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          
      - name: Persist CID for release
        if: matrix.target.env == 'devnet' && github.ref == 'refs/heads/main' && steps.final.outputs.cid != ''
        run: |
          mkdir -p .release-cid
          echo "${{ steps.final.outputs.cid }}" > .release-cid/cid

      - name: Cache CID by commit
        if: matrix.target.env == 'devnet' && github.ref == 'refs/heads/main' && steps.final.outputs.cid != ''
        uses: actions/cache/save@v4
        with:
          path: .release-cid
          key: release-cid-${{ github.sha }}

      - name: Deployment summary
        env:
          TARGET_ENV: ${{ matrix.target.env }}
        run: |
          DOMAIN="${{ steps.final.outputs.domain }}"
          CID="${{ steps.final.outputs.cid }}"
          if [ -z "$DOMAIN" ]; then
            echo "### Deployment completed but domain output is missing" >> $GITHUB_STEP_SUMMARY
            echo "CID \`${CID}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ${DOMAIN}.dot (${TARGET_ENV})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Browser &nbsp; https://${DOMAIN}.dot.li" >> $GITHUB_STEP_SUMMARY
            echo "Desktop &nbsp; \`${DOMAIN}.dot\`" >> $GITHUB_STEP_SUMMARY
            echo "CID &nbsp; \`${CID}\`" >> $GITHUB_STEP_SUMMARY
          fi

  post-deploy:
    name: Mark as Deployed
    needs: [check, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment marker
        run: echo "deployed" > .deployment-marker

      - name: Cache deployment marker
        uses: actions/cache/save@v4
        with:
          path: .deployment-marker
          key: deploy-browse-${{ needs.check.outputs.source-hash }}
